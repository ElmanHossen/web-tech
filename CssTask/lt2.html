<!DOCTYPE html>
<html>
<head>
    <title>About Page</title>

    <style>

        body{
            font-family: Arial;
            margin: 20px;
            padding: 20px;
            background-color: #eeeeee;
        }

        .section{
            padding: 20px;
            margin: 20px;
        }

        #about{
            background-color: lightblue;
        }

        #education{
            background-color: lightgreen;
        }

        #hobbies{
            background-color: lightyellow;
        }

        hr{
            background-color: black;
            height: 3px;
            width: 80%;
            border: none;
        }

    </style>

</head>

<body>

<div id="about" class="section">
    <h2>About Me</h2>
    <p style="color: blue;">My name is John Smith. I am a student of AIUB.</p>
</div>

<hr>

<div id="education" class="section">
    <h2>Education</h2>
    <p>I am studying Computer Science and Engineering.</p>
</div>

<hr>

<div id="hobbies" class="section">
    <h2>Hobbies</h2>
    <p>I like reading books, coding and playing football.</p>
</div>

</body>
</html>
