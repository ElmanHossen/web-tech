<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>
    <h1>Student Records</h1>
    <div class="form-area">
        <input type="text" id="sName" placeholder="Name">
        <input type="text" id="sRoll" placeholder="Roll">
        <input type="text" id="sDept" placeholder="Department">
        <button id="addBtn">Add Student</button>
        <p id="formError" class="error"></p>
    </div>
    <table id="studentTable">
        <tr>
            <th>Name</th>
            <th>Roll</th>
            <th>Department</th>
            <th>Action</th>
        </tr>
    </table>
    <script src="script4.js"></script>
</body>
</html>
