<!DOCTYPE html>
<html>
<head>
    <title>Style Control</title>
    <link rel="stylesheet" href="style7.css">
</head>
<body>
    <h1>Style Control Panel</h1>
    <p id="sampleText">This is a sample paragraph. Click the buttons below to change my style.</p>
    <div class="buttons">
        <button id="bgBtn">Change Background Color</button>
        <button id="sizeBtn">Increase Font Size</button>
        <button id="centerBtn">Center Text</button>
        <button id="resetBtn">Reset Style</button>
    </div>
    <script src="script7.js"></script>
</body>
</html>
