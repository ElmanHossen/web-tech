<!DOCTYPE html>
<html>
<head>
    <title>University Admission Form</title>

   </head>

<body>

<h1>University Admission Form</h1>

<form>

<fieldset>

<legend>Personal Information</legend>

<label>Full Name:</label><br>
<input type="text" maxlength="50" required><br><br>

<label>Email:</label><br>
<input type="email" required><br><br>

<label>Date of Birth:</label><br>
<input type="date" required><br><br>

<label>Gender:</label><br>
<input type="radio" name="gender" required> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
<br><br>

<label>Interests:</label><br>
<input type="checkbox"> Programming
<input type="checkbox"> Sports
<input type="checkbox"> Music
<input type="checkbox"> Reading
<br><br>

</fieldset>

<br>

<fieldset>

<legend>Academic Information</legend>

<label>College Name:</label><br>
<input type="text" maxlength="60" required><br><br>

<label>GPA:</label><br>
<input type="text" maxlength="4" required><br><br>

<label>Course Selection:</label><br>
<select required>
    <option>CSE</option>
    <option>CS</option>
    <option>EEE</option>
    <option>BBA</option>
</select>
<br><br>

<label>Upload Transcript:</label><br>
<input type="file" required><br><br>

</fieldset>

<br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
